services:
  - type: web
    name: domination
    runtime: static
    buildCommand: echo "sem build"
    staticPublishPath: ./public
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=300
  - type: web
    name: domination-ws
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
