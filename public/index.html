<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Domination — Mundo Aberto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#2b2f45;font-family:Nunito,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit}
#app{position:relative;max-width:480px;height:100%;height:100dvh;margin:0 auto;background:#dfe2ec;display:flex;flex-direction:column;overflow:hidden}
.lil{font-family:'Lilita One',Nunito,sans-serif;letter-spacing:.5px}

/* topo */
#top{display:flex;gap:8px;align-items:center;padding:12px 12px 8px}
.sq{width:44px;height:44px;border-radius:12px;background:#fff;border:2px solid #b9bfd6;display:grid;place-items:center;cursor:pointer;margin-right:auto}
.pill{display:flex;align-items:center;background:#fff;border:2px solid #9aa1c4;border-radius:12px;height:42px;min-width:112px;overflow:hidden}
.pill .ic{width:38px;height:100%;background:#e5e8f3;display:grid;place-items:center}
.pill b{flex:1;text-align:center;font-family:'Lilita One',sans-serif;font-weight:400;font-size:20px;color:#1d2033;padding:0 10px}
.coin{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#f8d64e 0 34%,#e3a51b 36% 44%,#f8d23f 46% 68%,#d99514 70%);border:2px solid #c58710;flex:none}
.gem{display:inline-block;width:22px;height:20px;background:linear-gradient(135deg,#ff9bb0,#e0334f 60%,#b81f3a);clip-path:polygon(25% 0,75% 0,100% 35%,50% 100%,0 35%);flex:none}

#screens{flex:1;position:relative;min-height:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* botões */
.btn{border:0;border-radius:14px;font-family:'Lilita One',sans-serif;color:#fff;cursor:pointer;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);text-shadow:0 2px 0 rgba(0,0,0,.25);letter-spacing:.5px}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.green{background:#6cc24a}.blue{background:#5b8ff0}.gray{background:#a8adc4}.gold{background:#f2b632}.purple{background:#b45ae6}
.btn[disabled]{filter:grayscale(.7);opacity:.65;cursor:default}

/* batalha */
.logo{text-align:center;font-size:38px;color:#3b5f82;text-shadow:0 3px 0 #fff,0 5px 0 rgba(0,0,0,.12);margin-top:2px}
.region{text-align:center;color:#6b7299;font-size:16px;margin-top:2px}
.prevwrap{flex:1;min-height:0;position:relative;margin:4px 10px}
#preview{position:absolute;inset:0}
.stages-row{display:flex;align-items:center;gap:14px;padding:6px 18px}
.roundbtn{width:72px;height:72px;border-radius:50%;border:3px solid #fff;background:#8c95c4;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:'Lilita One';font-size:10px;cursor:pointer;position:relative;box-shadow:0 3px 0 #6b74a3}
.roundbtn .dot{position:absolute;top:-2px;right:-2px;width:20px;height:20px;border-radius:50%;background:#e8344f;border:2px solid #fff;color:#fff;font-style:normal;font-size:12px;display:none;place-items:center}
.roundbtn .dot.on{display:grid}
#stages{flex:1;display:flex;align-items:center}
#stages .node{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:'Lilita One';color:#fff;border:3px solid #fff;flex:none;background:#c4c9de;color:#8a90b2}
#stages .node.done{background:#6cc24a;color:#fff}
#stages .node.cur{background:#c4c9de;color:#6c739c;box-shadow:0 0 0 3px #6cc24a;transform:scale(1.15)}
#stages .bar{flex:1;height:10px;background:#c4c9de;border-top:2px solid #fff;border-bottom:2px solid #fff}
#stages .bar.done{background:#6cc24a}
.play-row{display:flex;gap:10px;padding:8px 14px 14px;align-items:stretch}
.side{width:80px;border:3px solid #fff;border-radius:14px;background:#a8adc4;color:#fff;font-family:'Lilita One';font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative;box-shadow:0 3px 0 #8a8fa8}
.side .lk{position:absolute;top:-8px;right:-8px}
#btnPlay{flex:1;font-size:38px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;line-height:1}
#btnPlay small{font-size:18px;margin-top:4px;display:block;width:100%;padding-top:5px;background:rgba(0,0,0,.08);border-radius:0 0 14px 14px}

/* melhorias */
#sc-up{overflow-y:auto}
.uphero{background:linear-gradient(#e9ebf3,#d7dae6);padding:6px 14px 14px}
.uphero h2{text-align:center;color:#4f9a33;font-size:24px;margin:2px 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{text-align:center}
.stats span{display:block;background:#7b80a6;color:#fff;font-family:'Lilita One';border-radius:8px 8px 0 0;padding:7px 0;font-size:15px}
.stats b.flash{animation:flash .9s}
@keyframes flash{0%,100%{background:#f4f5fa;transform:none}30%{background:#c9f0b8;color:#2f7a1d;transform:scale(1.08)}}
.card .next{font-size:11px;color:#8a90b2;font-weight:800;margin:-4px 0 6px}
.stats b{display:block;background:#f4f5fa;font-family:'Lilita One';font-weight:400;color:#4c5277;border-radius:0 0 8px 8px;padding:8px 0;font-size:19px}
.cmd{background:#f2f3f9;padding:12px 14px;border-top:3px solid #c5cae0;border-bottom:3px solid #c5cae0;display:flex;align-items:center;gap:10px}
.badge{width:46px;height:46px;flex:none;background:#3e6ad6;color:#fff;font-family:'Lilita One';display:grid;place-items:center;font-size:18px;clip-path:polygon(50% 0,61% 12%,78% 7%,82% 24%,98% 30%,90% 46%,100% 60%,85% 70%,85% 88%,67% 88%,50% 100%,33% 88%,15% 88%,15% 70%,0 60%,10% 46%,2% 30%,18% 24%,22% 7%,39% 12%)}
.cmdbar{flex:1}
.cmdbar small{font-family:'Lilita One';color:#6b7299;font-size:13px}
.cmdbar .trk{height:16px;background:#c5cae0;border-radius:8px;overflow:hidden;margin-top:4px;border:2px solid #fff}
.cmdbar .trk i{display:block;height:100%;background:#5b8ff0;border-radius:6px}
.reward{background:#fff;border:2px solid #b9bfd6;border-radius:10px;padding:5px 8px;display:flex;flex-direction:column;align-items:center;font-family:'Lilita One';font-size:12px;color:#333;gap:2px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 12px}
.card{background:#fff;border:3px solid #c5cae0;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.card h4{font-family:'Lilita One';font-weight:400;color:#4c5277;font-size:19px;padding-top:8px}
.card .art{width:78%;aspect-ratio:1;background:#eef0f7;border-radius:8px;display:grid;place-items:center;margin:6px 0}
.card .delta{font-family:'Lilita One';color:#58b23a;font-size:20px}
.card .nm{font-family:'Lilita One';color:#5b8ff0;font-size:14px;margin:2px 0 8px}
.card .btn{width:100%;border-radius:0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:22px;padding:8px 0 10px}

/* bloqueado / nav */
#nav{display:grid;grid-template-columns:repeat(5,1fr);background:#e9ebf5;border-top:2px solid #c3c8de;height:78px;flex:none}
#nav button{border:0;border-right:1px solid #cdd1e4;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:'Lilita One';color:#5f6790;font-size:12px;position:relative;cursor:pointer}
#nav button span{display:none}
#nav button.on{background:#fff}
#nav button.on span{display:block}
#nav button.on svg{transform:scale(1.2) translateY(-3px)}
#nav .lk{position:absolute;top:6px;right:12px}
#nav .alert{position:absolute;top:6px;right:12px;width:20px;height:20px;border-radius:50%;background:#e8344f;color:#fff;font-size:13px;display:none;place-items:center;border:2px solid #fff}
#nav .alert.on{display:grid}

/* jogo */
#game{position:absolute;inset:0;z-index:10;background:linear-gradient(#8fdcf7,#4f9fe0 55%,#2f6fc0);display:none}
#game.on{display:block}
#cv{width:100%;height:100%;display:block;touch-action:none}
#btnBack{position:absolute;left:10px;top:12px;width:46px;height:46px;border:0;background:transparent;font-size:42px;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(20,40,90,.45);cursor:pointer;font-family:'Lilita One'}
#pbar{position:absolute;left:66px;right:66px;top:22px;height:24px;border:3px solid #fff;border-radius:12px;display:flex;overflow:hidden;background:#a6a6a6;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#pbar div{height:100%;transition:width .3s}
#lvTag{position:absolute;right:12px;top:24px;font-family:'Lilita One';color:#fff;text-shadow:0 2px 0 rgba(20,40,90,.45);font-size:15px;text-align:right;line-height:1}
#btnDrop{position:absolute;right:16px;bottom:20px;width:80px;height:80px;border-radius:50%;border:0;padding:6px;background:conic-gradient(#f2b632 calc(var(--p,0)*1%),#8d8d8d 0);cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25)}
#btnDrop span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#5c6593;border:3px solid #fff}
#btnDrop.ready{animation:pulse 1s infinite}
#btnDrop.active span{background:#f2b632}
#hint{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-family:'Lilita One';color:#fff;text-shadow:0 2px 0 rgba(20,40,90,.5);font-size:16px;pointer-events:none;transition:opacity .5s;padding:0 100px}
@keyframes pulse{50%{transform:scale(1.08)}}

/* modal */
#modal{position:absolute;inset:0;z-index:20;background:rgba(25,28,45,.78);display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
.box{width:100%;max-width:420px;max-height:94%;overflow:auto;display:flex;flex-direction:column;align-items:center}
.banner{position:relative;font-family:'Lilita One';color:#fff;font-size:46px;padding:4px 30px;background:#5fbf45;border-radius:6px;text-shadow:0 3px 0 rgba(0,0,0,.25);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15);z-index:2;-webkit-text-stroke:2px #2f7a1d}
.banner.red{background:#e2574c;-webkit-text-stroke:2px #8e2219}
.panel{background:#e6e7f3;border:4px solid #fff;border-radius:16px;width:100%;padding:28px 16px 18px;margin-top:-16px;text-align:center}
.panel h3{font-family:'Lilita One';font-weight:400;color:#5c6390;font-size:22px;margin-bottom:12px}
.tile{display:inline-flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:2px solid #c5cae0;border-radius:10px;padding:10px 18px;margin:0 4px;font-family:'Lilita One';font-size:20px;color:#222;box-shadow:0 3px 0 #c5cae0}
.tile .coin,.tile .gem{width:36px;height:36px}
.trophy{font-size:84px;line-height:1;margin-bottom:-6px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.glow{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(rgba(255,214,90,.45),transparent 65%);top:-60px;left:50%;transform:translateX(-50%);pointer-events:none}
.cta{margin-top:18px;font-size:24px;padding:12px 40px}
.linkbtn{background:none;border:0;color:#d0d3e6;font-family:'Lilita One';font-size:22px;margin-top:18px;cursor:pointer}
.sheet{background:#fff;border-radius:16px;width:100%;overflow:hidden;border:3px solid #fff}
.sheet .hd{background:linear-gradient(#5b8ff0,#4a77d6);padding:14px;text-align:center;color:#fff;font-family:'Lilita One';font-size:28px;text-shadow:0 2px 0 rgba(0,0,0,.25);position:relative}
.sheet .hd small{display:inline-block;background:#e8344f;border-radius:8px;font-size:13px;padding:3px 10px;margin-bottom:6px}
.starbar{display:flex;align-items:center;gap:6px;margin-top:10px;padding:0 6px}
.starbar .trk{flex:1;height:14px;background:#c5cae0;border-radius:7px;position:relative;border:2px solid #fff}
.starbar .trk i{position:absolute;left:0;top:0;bottom:0;background:#f2b632;border-radius:7px}
.chests{display:flex;justify-content:space-between;padding:8px 10px 0 38px}
.chest{display:flex;flex-direction:column;align-items:center;font-size:12px;font-family:'Lilita One';cursor:default;border:0;background:none;color:#fff;gap:2px}
.chest b{font-size:24px;line-height:1;filter:grayscale(1);opacity:.7}
.chest.ready b{filter:none;opacity:1;animation:pulse 1s infinite;cursor:pointer}
.chest.got b{filter:none;opacity:.35}
.mis{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:2px solid #eceef6}
.mis .st{width:44px;text-align:center;font-family:'Lilita One';color:#555;font-size:13px}
.mis .tx{flex:1;font-weight:800;color:#4c5277;font-size:14px}
.mis .pg{height:16px;background:#c5cae0;border-radius:8px;margin-top:5px;position:relative;overflow:hidden}
.mis .pg i{position:absolute;left:0;top:0;bottom:0;background:#5b8ff0}
.mis .pg em{position:absolute;inset:0;text-align:center;font-style:normal;font-size:11px;color:#fff;font-family:'Lilita One';line-height:16px}
.mis .btn{width:84px;padding:10px 0;font-size:16px}
.closex{background:none;border:0;color:#fff;font-size:42px;font-family:'Lilita One';margin-top:10px;cursor:pointer}
.plain{background:#fff;border-radius:16px;padding:20px;width:100%;text-align:center}
.plain h3{font-family:'Lilita One';font-weight:400;color:#4c5277;font-size:24px;margin-bottom:8px}
.plain p{color:#6b7299;font-weight:700;margin-bottom:14px}
.plain .btn{padding:12px 18px;font-size:18px;margin:4px}

.dsec{padding:14px 16px;border-bottom:2px solid #eceef6;text-align:center}
.dsec h4{font-family:'Lilita One';font-weight:400;color:#4c5277;font-size:20px}
.dsec h5{font-family:'Lilita One';font-weight:400;color:#8a90b2;font-size:14px;margin:14px 0 4px;text-align:left}
.dsec p{color:#6b7299;font-weight:700;font-size:14px;margin:4px 0 10px}
.dsec .btn{padding:12px 22px;font-size:18px}
.code{font-family:'Lilita One';font-size:40px;letter-spacing:8px;color:#3b5f82;margin:2px 0}
.crow{display:flex;gap:8px;margin-top:12px}
.crow input{flex:1;min-width:0;border:2px solid #c5cae0;border-radius:12px;font-family:'Lilita One';font-size:20px;text-align:center;text-transform:uppercase;padding:8px;letter-spacing:4px;color:#3b5f82}
.rl .r{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-top:1px solid #eceef6;font-weight:800;color:#4c5277}
.rl .r .btn{padding:8px 14px;font-size:14px}
.rl .muted{color:#a3a8c3;font-size:13px}
.dnote{padding:10px 16px 14px;color:#8a90b2;font-size:12px;font-weight:700;text-align:center}
#legend{position:absolute;left:10px;right:10px;top:52px;display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;font-family:'Lilita One';font-size:12px;color:#24346b;pointer-events:none}
#legend span{display:inline-flex;align-items:center;gap:4px}#legend span.out{opacity:.4;text-decoration:line-through}
#legend i,.lob i,.rank b i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.lob .r span{display:flex;align-items:center;gap:8px}.lob .r small{color:#a3a8c3;font-size:11px}
.rank div{display:flex;align-items:center;gap:10px;padding:5px 0;font-weight:800;color:#4c5277;border-top:1px solid #d7dae6}
.rank b{color:#fff;border-radius:8px;padding:2px 8px;font-family:'Lilita One';font-weight:400;min-width:36px;text-align:center}
#toast{position:absolute;left:50%;top:76px;transform:translate(-50%,-20px);background:#2b2f45;color:#fff;font-family:'Lilita One';padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:30;pointer-events:none;white-space:nowrap;font-size:16px}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
<link rel="stylesheet" href="/world.css">
<script src="/world-motion.js"></script>
</head>
<body class="world-mode">
<div id="app">
  <section id="worldScreen" aria-label="Mundo aberto"><div id="worldRoot"><p class="world-loading">Conectando ao mundo…</p></div></section>
  <dialog id="worldDialog"></dialog>
  <button id="backToWorld" aria-label="Voltar ao mundo aberto">MUNDO</button>
  <div id="top">
    <button class="sq" id="btnSettings" aria-label="Configurações">
      <svg width="26" height="26" viewBox="0 0 24 24"><path fill="#5f6790" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.4-2.7a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
    <div class="pill"><span class="ic"><i class="gem"></i></span><b id="gems">0</b></div>
    <div class="pill"><span class="ic"><i class="coin"></i></span><b id="coins">0</b></div>
  </div>

  <div id="screens">
    <section class="screen on" id="sc-battle">
      <div class="logo lil">DOMINATION</div>
      <div class="region lil" id="regionName"></div>
      <div class="prevwrap"><canvas id="preview"></canvas></div>
      <div class="stages-row">
        <button class="roundbtn" id="btnMissions">
          <svg width="30" height="30" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fff"/><circle cx="12" cy="12" r="6.5" fill="#8c95c4"/><circle cx="12" cy="12" r="3" fill="#fff"/><path d="M12 12 21 3" stroke="#e8344f" stroke-width="2.4"/></svg>
          MISSÕES<i class="dot" id="misDot">!</i>
        </button>
        <div id="stages"></div>
      </div>
      <div class="play-row">
        <button class="side" data-soon>
          <svg width="30" height="30" viewBox="0 0 24 24"><path fill="#fff" d="M7 3h10v3h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 15.9V18h3v3H8v-3h3v-2.1A5 5 0 0 1 8.3 13H8a4 4 0 0 1-4-4V6h3zm-1 5v1a2 2 0 0 0 1 1.7V8zm12 0v2.7a2 2 0 0 0 1-1.7V8z"/></svg>LIGA
          <span class="lk"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#7b80a6" stroke="#fff" stroke-width="2"/><rect x="7.5" y="11" width="9" height="7" rx="1.5" fill="#fff"/><path d="M9.5 11V9a2.5 2.5 0 0 1 5 0v2" stroke="#fff" stroke-width="2" fill="none"/></svg></span>
        </button>
        <button class="btn green" id="btnPlay">JOGAR<small id="playLv">NÍVEL 1</small></button>
        <button class="side" id="btnDuel" style="background:#e2574c;box-shadow:0 3px 0 #a8352c">
          <svg width="30" height="30" viewBox="0 0 24 24"><path d="M4 4l11 11M20 4 9 15" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M6 15l3 3M18 15l-3 3M4 20l3-3M20 20l-3-3" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>DUELO
        </button>
      </div>
    </section>

    <section class="screen" id="sc-up">
      <div class="uphero">
        <svg viewBox="0 0 300 120" width="100%" height="110">
          <path d="M40 20c30-14 52 6 60 24s4 40-10 54-46 14-58-6-22-58 8-72z" fill="#a9cdf3"/>
          <path d="M200 14c34-10 62 8 66 34s-8 52-30 60-50-2-56-30 0-56 20-64z" fill="#a9cdf3"/>
          <circle cx="72" cy="62" r="17" fill="#3b5f82"/><circle cx="230" cy="62" r="17" fill="#3b5f82"/>
          <circle cx="150" cy="40" r="7" fill="#3b5f82"/><circle cx="160" cy="62" r="7" fill="#3b5f82"/><circle cx="150" cy="84" r="7" fill="#3b5f82"/>
        </svg>
        <h2 class="lil">SUAS MELHORIAS</h2>
        <div class="stats">
          <div><span>GUARNIÇÃO</span><b id="stG">10</b></div>
          <div><span>PRODUÇÃO</span><b id="stP">1/SEG</b></div>
          <div><span>CAPACIDADE</span><b id="stC">50</b></div>
        </div>
      </div>
      <div class="cmd">
        <div class="badge" id="cmdLv">0</div>
        <div class="cmdbar"><small id="cmdTxt">COMANDANTE</small><div class="trk"><i id="cmdFill"></i></div></div>
        <div class="reward" id="cmdReward"></div>
      </div>
      <div class="cards" id="cards"></div>
    </section>

const hexPts=(x,y,r)=>{const p=[];for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-90);p.push([x+r*Math.cos(a),y+r*Math.sin(a)])}return p};
function hexPath(c,x,y,r){const p=hexPts(x,y,r);c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<6;i++)c.lineTo(p[i][0],p[i][1]);c.closePath()}
const EDGE=[[2,0,1,2],[1,1,2,3],[-1,1,3,4],[-2,0,4,5],[-1,-1,5,0],[1,-1,0,1]];
const CELLKEY=new Map(HX.cells.map((q,i)=>[q.c+','+q.r,i]));
function drawMap(c,L,sites,pal=[0,1,2,3,4]){
  const cells=HX.cells,depth=HR*0.5,rr=HR*0.99;
  const ord=cells.map((q,i)=>i).sort((a,b)=>cells[a].y-cells[b].y||cells[a].x-cells[b].x);
  c.save();c.lineJoin='round';
  c.fillStyle='rgba(228,246,255,.35)';for(const i of ord){const q=cells[i];hexPath(c,q.x,q.y+depth*0.6,HR*1.2);c.fill()}
  c.fillStyle='rgba(255,255,255,.55)';for(const i of ord){const q=cells[i];hexPath(c,q.x,q.y+depth*0.5,HR*1.08);c.fill()}
  for(const i of ord){const q=cells[i],s=sites[q.t],T=TEAMC[pal[s.owner]||0],isBase=HX.seeds[q.t].cell===i;
    const top=s.owner?(isBase?T.baseHex:(HX.tcol[q.t]%2?T.hexTop:T.hexTop2)):(isBase?'#c3bae6':NEU[HX.tcol[q.t]%NEU.length]);
    const side=s.owner?T.hexSide:'#a69dd2';
    c.fillStyle=side;c.strokeStyle=side;c.lineWidth=1;hexPath(c,q.x,q.y+depth,rr);c.fill();c.stroke();
    c.fillStyle=top;c.strokeStyle=top;c.lineWidth=1.2;hexPath(c,q.x,q.y,rr);c.fill();c.stroke()}
  c.lineCap='round';
  for(const i of ord){const q=cells[i],p=hexPts(q.x,q.y,rr);
    for(const [dc,dr,a,b] of EDGE){const n=CELLKEY.get((q.c+dc)+','+(q.r+dr));
      if(n==null){c.strokeStyle='#ffffff';c.lineWidth=2.6}
      else if(cells[n].t!==q.t&&n>i){c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=1.3}else continue;
      c.beginPath();c.moveTo(p[a][0],p[a][1]);c.lineTo(p[b][0],p[b][1]);c.stroke()}}
  c.restore();
}
/* ---- sprites (SVG → imagem, desenhadas no canvas) ---- */
const SPR=(()=>{
  const D=window.DSPR||null,RS=3,cache=new Map();
  function img(key,make,vb){let e=cache.get(key);if(e)return e;e={ok:false,vb};cache.set(key,e);
    if(!D)return e;const [x,y,w,h]=vb;
    const s=`<svg xmlns="http://www.w3.org/2000/svg" width="${w*RS}" height="${h*RS}" viewBox="${x} ${y} ${w} ${h}">${make()}</svg>`;
    const im=new Image();e.im=im;im.onload=()=>{e.ok=true;SPR.loaded++};im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);return e}
  const BVB=[-30,-46,60,64],UVB=[-30,-50,60,62],N=32;
  const hi=h=>((Math.round(h/(2*Math.PI)*N)%N)+N)%N;
  return {loaded:0,
    building:(kind,col)=>img('b'+kind+col,()=>D.S.building(kind,col,1,{part:'base'}),BVB),
    turret:(col,h)=>{const k=hi(h);return img('t'+col+'_'+k,()=>D.S.building('canhao',col,1,{part:'turret',h:k*2*Math.PI/N}),BVB)},
    unit:(kind,col,h)=>{const k=hi(h);return img('u'+kind+col+'_'+k,()=>D.U3.unit3d(kind,col,k*2*Math.PI/N,0,1,{noShadow:1,noRotor:1,lift:kind==='heli'?12:1}),UVB)},
    draw(c,e,x,y,s){if(!e.ok)return false;const [vx,vy,w,h]=e.vb;c.drawImage(e.im,x+vx*s,y+vy*s,w*s,h*s);return true},
    muzzle(s,h){ // ponto da boca do cano (coordenadas do mapa)
      if(s.kind==='central'){let best=null,bd=1e9;const a=h*180/Math.PI;for(const g of D.S.CGUN){const d=Math.abs(((a-g.deg)%360+540)%360-180);if(d<bd){bd=d;best=g}}return[s.x+best.mx*1.32,s.y-2+best.my*1.32]}
      const m=D.U3.turretMuzzle(h);return[s.x+m[0]*1.32,s.y-2+(m[1]-1)*1.32]},
    preload(cols){if(!D)return;for(const col of cols)for(const k of ['garagem','heli','botes','canhao','central'])this.building(k,col)},
    preloadUnits(cols){if(!D)return;const q=[];for(const col of cols){for(let i=0;i<N;i++){const h=i*2*Math.PI/N;for(const k of ['tanque','desliz','heli'])q.push(()=>this.unit(k,col,h));q.push(()=>this.turret(col,h))}}
      const step=()=>{for(let n=0;n<16&&q.length;n++)q.shift()();if(q.length)setTimeout(step,16)};step()}
  };
})();
function drawBase(c,s,col,X,Y,sc){
  const x=X(s.x),y=Y(s.y-2);
  SPR.draw(c,SPR.building(s.kind,col),x,y,1.32*sc);
  if(s.kind==='canhao'){const h=s.vh!=null?s.vh:(s.x<MW/2?0:Math.PI);let sl=0;if(s.kick!=null&&s.kick<0.3)sl=3*(1-s.kick/0.3);
    const ux=Math.cos(h),uy=Math.sin(h)*0.6;SPR.draw(c,SPR.turret(col,h),x-ux*sl*1.32*sc,y-1.32*sc*0-uy*sl*1.32*sc,1.32*sc)}
}

/* ---- comandos (online: agendados para alguns ticks à frente) ---- */
function cmdSend(owner,srcs,dst){
  const g=game;if(!srcs.length||!dst)return;
  if(g.mode==='world'){g.worldCommand({type:'send',sources:srcs.map(s=>s.id),target:dst.id});return;}
  const ok=srcs.filter(s=>canReach(s,dst));
  if(!ok.length){if(owner===g.me||g.mode==='local')toast('🌊 Tanque não atravessa a água — use o heliporto ou os botes');return}
  srcs=ok;
  if(g.mode==='online'){g.myActs.push({id:g.me+':'+(++g.actN),o:owner,k:g.tick+inDelay(g),t:'s',s:srcs.map(x=>x.id),d:dst.id});return}
  srcs.forEach(x=>send(x,dst));
}
function cmdDrop(owner,site){

  if(g.mode==='online'){g.myActs.push({id:g.me+':'+(++g.actN),o:owner,k:g.tick+inDelay(g),t:'d',s:site.id});return}

function doDrop(owner,s){

  s.troops+=add;g.dropM[owner]=0;
  g.fx.push({type:'txt',x:s.x,y:s.y-22,t:0,text:'+'+add});g.fx.push({type:'ring',x:s.x,y:s.y,t:0,c:'#f2b632'});
}
function applyActsAt(T){

    if(a.t==='s'){const d=g.sites[a.d];if(!d)continue;for(const id of a.s){const f=g.sites[id];if(f&&f.owner===a.o)send(f,d)}}

const dropTick=o=>{const d=game.drops.find(d=>d.o===o);return d?d.k:null};
function dropOwner(o){
  const g=game;

  g.units=g.units.filter(u=>u.owner!==o);for(const u of g.units)if(u.fight&&(u.fight.a.owner===o||u.fight.b.owner===o))u.fight=null;g.fights=g.fights.filter(f=>f.a.owner!==o&&f.b.owner!==o);

}
/* ---- tropas: um grupo por envio (tanque por terra, deslizador pela água, helicóptero pelo ar) ---- */
const unitKind=s=>s.kind==='heli'?'heli':s.kind==='botes'?'desliz':'tanque';
const canReach=(a,b)=>!!a&&!!b&&a!==b&&(unitKind(a)!=='tanque'||HX.comp[a.cell]===HX.comp[b.cell]);
function mkPath(a,b,k){
  const P=k==='tanque'?HX.path(a.cell,b.cell):[[a.x,a.y],[b.x,b.y]];
  const cum=[0];for(let i=1;i<P.length;i++){const dx=P[i][0]-P[i-1][0],dy=P[i][1]-P[i-1][1];cum.push(cum[i-1]+Math.sqrt(dx*dx+dy*dy))}

}
function send(from,to){
  const g=game;if(!canReach(from,to))return;
  const n=Math.floor(from.troops);if(n<1)return;
  const k=unitKind(from),path=mkPath(from,to,k);if(path.L<=0)return;

  g.units.push({id:++g.uid,k,owner:from.owner,n,P:path.P,cum:path.cum,L:path.L,d:0,si:0,to,x:from.x,y:from.y,alive:true});
}
function upos(u){
  while(u.si<u.P.length-2&&u.d>u.cum[u.si+1])u.si++;
  const i=u.si,a=u.P[i],b=u.P[i+1]||a,seg=(u.cum[i+1]-u.cum[i])||1,f=Math.max(0,Math.min(1,(u.d-u.cum[i])/seg));
  u.x=a[0]+(b[0]-a[0])*f;u.y=a[1]+(b[1]-a[1])*f;
}
function arrive(u){
  const b=u.to,g=game;
  if(b.owner===u.owner){b.troops+=u.n;return}
  if(u.owner===g.me&&b.owner!==0)g.stats.kill+=Math.min(u.n,Math.floor(b.troops));
  b.troops-=u.n;
  if(b.troops<0){
    b.owner=u.owner;b.troops=-b.troops;b.hq=false;g.dirty=true;
    g.fx.push({type:'ring',x:b.x,y:b.y,t:0,c:'#ffffff'});g.fx.push({type:'cap',x:b.x,y:b.y,t:0,o:u.owner});
    if(u.owner===g.me)g.stats.cap++;
  }else g.fx.push({type:'hit',x:b.x,y:b.y,t:0});
}
function danger(t,o){
  const g=game,C=g.sites[HX.center];let d=0;
  if(t.kind==='central')d+=7;else if(t.kind==='canhao')d+=3;
  if(t!==C&&C.owner!==o){const dx=t.x-C.x,dy=t.y-C.y;if(dx*dx+dy*dy<(RANGE.central+12)**2)d+=4}
  return d;
}
function aiThink(ai){
  const g=game,mine=g.sites.filter(s=>s.owner===ai.id);if(!mine.length)return;
  let best=null,bs=-1e9;
  for(const t of g.sites){
    if(t.owner===ai.id)continue;
    const srcs=mine.filter(s=>s.troops>=4&&canReach(s,t)).sort((a,b)=>Math.hypot(a.x-t.x,a.y-t.y)-Math.hypot(b.x-t.x,b.y-t.y)).slice(0,3);
    if(!srcs.length)continue;
    const dist=Math.hypot(srcs[0].x-t.x,srcs[0].y-t.y);
    const grow=t.owner===0?0:(dist/45)*g.par[t.owner].prod;
    const need=t.troops+grow+danger(t,ai.id)+2;
    let sum=0,use=[];for(const s of srcs){if(sum>=need*1.15)break;use.push(s);sum+=Math.floor(s.troops)}
    if(sum<need*1.15)continue;
    const sc=40-need-dist/12+(t.owner===0?4:0)+(t.owner===1?g.aip.aggr*10:0)+(t.kind==='central'?5:0)+(t.hq?3:0)+Math.random()*4-use.length*2;

const alive=o=>game.sites.some(s=>s.owner===o)||game.units.some(u=>u.owner===o);
function segX(ax,ay,bx,by,cx,cy,dx,dy){ // os deslocamentos deste passo se cruzam?
  const d1=(bx-ax)*(cy-ay)-(by-ay)*(cx-ax),d2=(bx-ax)*(dy-ay)-(by-ay)*(dx-ax),d3=(dx-cx)*(ay-cy)-(dy-cy)*(ax-cx),d4=(dx-cx)*(by-cy)-(dy-cy)*(bx-cx);

/* passo determinístico da simulação (mesmo resultado em todos os aparelhos da partida online) */
function simStep(dt){
  const g=game;g.time+=dt;
  for(const s of g.sites){
    if(s.owner===0)continue;
    const P=g.par[s.owner];
    if(s.troops<P.cap)s.troops=Math.min(P.cap,s.troops+P.prod*dt*(s.hq?1.25:1));
    else s.troops=Math.max(P.cap,s.troops-dt*1.5);
  }
  for(const u of g.units){
    u.px=u.x;u.py=u.y;
    if(u.fight)continue;               // em batalha: fica parado
    u.d+=SPEED[u.k]*dt;
    if(u.d>=u.L){u.alive=false;arrive(u);continue}
    upos(u);
  }
  // tropas inimigas que se encontram param, viram uma para a outra e trocam tiros (-1 por tiro) até uma acabar
  const us=g.units;
  for(let i=0;i<us.length;i++){
    const u=us[i];if(!u.alive||u.fight)continue;
    for(let j=i+1;j<us.length;j++){
      const v=us[j];if(!v.alive||v.fight||v.owner===u.owner)continue;
      const dx=u.x-v.x,dy=u.y-v.y;
      if(dx*dx+dy*dy<3364||segX(u.px,u.py,u.x,u.y,v.px,v.py,v.x,v.y)){
        const f={a:u,b:v,ta:0.25,tb:0.4,x:(u.x+v.x)/2,y:(u.y+v.y)/2,age:0};u.fight=f;v.fight=f;g.fights.push(f);
        g.fx.push({type:'clash',x:f.x,y:f.y,t:0});break}
    }
  }
  for(const f of g.fights){
    f.age+=dt;f.ta-=dt;f.tb-=dt;
    for(const [sh,tg,k] of [[f.a,f.b,'ta'],[f.b,f.a,'tb']]){
      if(f[k]>0||sh.n<=0||tg.n<=0)continue;
      f[k]+=0.3;tg.n--;sh.kick=0;
      if(sh.owner===g.me)g.stats.kill++;
      g.fx.push({type:'ushot',from:sh,to:tg,t:0});
    }
    if(f.a.n<=0||f.b.n<=0||!f.a.alive||!f.b.alive){f.done=true;
      for(const u of [f.a,f.b]){u.fight=null;if(u.n<=0&&u.alive){u.alive=false;g.fx.push({type:'boom',x:u.x,y:u.y,t:0})}}}
  }
  g.fights=g.fights.filter(f=>!f.done);
  // bombardeiros: atiram no inimigo mais próximo dentro do alcance (-1 tropa por tiro)
  for(const s of g.sites){
    if(s.kind!=='central'&&s.kind!=='canhao')continue;

    if(!best)continue;
    s.cd=FIRE[s.kind];best.n-=1;s.tx=best.x;s.ty=best.y;s.kick=0;
    if(s.owner===g.me&&best.owner!==g.me)g.stats.kill++;
    g.fx.push({type:'shot',s,x:best.x,y:best.y,t:0,heli:best.k==='heli'});
    if(best.n<=0){best.alive=false;g.fx.push({type:'boom',x:best.x,y:best.y,t:0});if(best.fight){const o=best.fight.a===best?best.fight.b:best.fight.a;o.fight=null;best.fight.done=true}}
  }

    for(const ai of g.ais){if(ai.dead)continue;ai.timer-=dt;if(ai.timer<=0){ai.timer=g.aip.int*(0.7+Math.random()*0.6);aiThink(ai)}}
    for(const ai of g.ais)if(!ai.dead&&!alive(ai.id)){ai.dead=true;g.fx.push({type:'out',o:ai.id,t:0});toast('☠️ Inimigo eliminado!')}

  }else{
    for(let o=1;o<=g.n;o++)if(!g.elim.includes(o)&&!alive(o)){g.elim.push(o);g.elimTick=g.elimTick||{};g.elimTick[o]=g.tick;if(o!==g.me&&!(g.gone&&g.gone[o]))toast('☠️ '+(g.names[o]||'Jogador')+' foi eliminado!')}
    const live=[];for(let o=1;o<=g.n;o++)if(!g.elim.includes(o))live.push(o);

  }
}
function rankPlayers(live){

}
function frame(rdt){
  const g=game;g.vt+=rdt;
  for(const f of g.fx)f.t+=rdt;
  g.fx=g.fx.filter(f=>f.t<({txt:1.2,cap:1.2,shot:1,ring:.8,boom:.6,hit:.6,clash:.5,ushot:.8}[f.type]||.5));
  if(g.mode==='world'){g.waiting=performance.now()-g.lastServerAt>2500?1:0;return;}
  if(g.time>6&&g.mode==='solo')$('#hint').style.opacity=0;
  if(g.mode!=='solo'&&g.time>4)$('#hint').style.opacity=0;
  if(g.mode==='online'&&(g.tick!==g.pubTick||g.myActs.length!==g.pubActs||g.quit)){g.pubTick=g.tick;g.pubActs=g.myActs.length;publish()}
  if(g.paused||g.over)return;
  if(g.cd>0){g.cd-=rdt;return}
  let rate=1;
  if(g.mode==='online'){ // quem está à frente desacelera um pouco; quem está atrás acelera — evita bater na janela e travar
    let lead=-1e9;for(const op of g.opps.values())if(!op.dropped&&op.theirs!=null)lead=Math.max(lead,(op.obs-op.theirs)/2);

    if(window.DOMHASH&&g.tick%30===0)window.DOMHASH[g.tick]=g.sites.map(s=>s.owner+':'+s.troops.toFixed(3)).join('|')+'/'+g.units.map(u=>u.owner+':'+u.n+':'+u.d.toFixed(2)).join(',');
    if(g.over)break;
  }
  g.waiting=stalled?g.waiting+rdt:0;
  if(g.mode==='online'&&!g.over){
    const now=performance.now();
    if(g.isHost){for(const op of g.opps.values())if(!op.dropped&&now-op.last>15000)scheduleDrop(op)}
    else if(now-g.hostLast>15000)duelEnd(null,'host');
  }

/* ---- duelo online: sincronização via presença da sala ---- */
function scheduleDrop(op){

}
function publish(){

  if(g.isHost){d.cfg=g.cfg;d.players=g.players;d.started=1;d.drops=g.drops.map(x=>({o:x.o,k:x.k}))}

}
function duelPeers(ch){

    const d=p&&p.presence&&p.presence.duel;
    if(d&&typeof d==='object'){
      const t=d.tick|0;if(t>op.tick){op.tick=t;op.last=now;const obs=g.tick-t;op.obs=op.obs==null?obs:op.obs*0.8+obs*0.2}
      if(d.off&&typeof d.off==='object'&&typeof d.off[g.myPeer]==='number'&&isFinite(d.off[g.myPeer]))op.theirs=Math.max(-60,Math.min(600,d.off[g.myPeer]));

        else if(a.t==='d'&&Number.isInteger(a.s))op.acts.set(a.id,{id:a.id,o:a.o,k:a.k,t:'d',s:a.s});

const WS_URL=location.host?((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host):'ws://localhost:10000';

function wsRoom(url){
  let ws=null,peerId=null,open=false,tries=0;const rooms=new Map(),conns=new Set();
  const pk=(p)=>Object.freeze({peer:p.peer,by:null,isMe:p.peer===peerId,sameTab:p.peer===peerId,kind:'viewer',guest:false,presence:Object.freeze(p.presence&&typeof p.presence==='object'?p.presence:{}),updatedAt:Date.now()});
  function connect(){
    try{ws=new WebSocket(url)}catch(e){return}
    ws.onopen=()=>{open=true;tries=0;conns.forEach(h=>{try{h(true)}catch(e){}});
      for(const [name,r] of rooms){ws.send(JSON.stringify({t:'join',room:name}));if(Object.keys(r.mine).length)ws.send(JSON.stringify({t:'pres',room:name,data:r.mine}))}};
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
      if(m.t==='hello'){peerId=m.peer;return}
      if(m.t!=='peers')return;const r=rooms.get(m.room);if(!r||!Array.isArray(m.peers))return;
      const old=new Map(r.peers.map(p=>[p.peer,p]));
      r.peers=Object.freeze(m.peers.filter(p=>p&&typeof p.peer==='string').map(pk));
      const now=new Set(r.peers.map(p=>p.peer));
      const ch={peers:r.peers,joined:r.peers.filter(p=>!old.has(p.peer)),left:[...old.values()].filter(p=>!now.has(p.peer)),updated:r.peers.filter(p=>old.has(p.peer))};
      r.hs.forEach(h=>{try{h(ch)}catch(e){}})};
    ws.onclose=()=>{open=false;conns.forEach(h=>{try{h(false)}catch(e){}});setTimeout(connect,Math.min(8000,1000*(1+tries++)))};
    ws.onerror=()=>{};
  }
  function mk(name){
    const r={mine:{},peers:Object.freeze([]),hs:new Set(),dirty:false,timer:0,left:false};rooms.set(name,r);
    const flush=()=>{r.timer=0;if(!r.dirty||!open||r.left)return;r.dirty=false;try{ws.send(JSON.stringify({t:'pres',room:name,data:r.mine}))}catch(e){}};
    r.api={name,
      presence:async(patch)=>{const n={...r.mine};for(const k in patch){if(patch[k]===null)delete n[k];else n[k]=JSON.parse(JSON.stringify(patch[k]))}r.mine=n;r.dirty=true;if(!r.timer)r.timer=setTimeout(flush,30)},
      peers:()=>r.peers,
      onPeers:(h)=>{r.hs.add(h);setTimeout(()=>{if(r.hs.has(h))h({peers:r.peers,joined:r.peers,left:[],updated:[]})},0);return()=>r.hs.delete(h)},
      emit:async()=>{},on:()=>()=>{},connected:()=>open,
      onConnection:(h)=>{conns.add(h);setTimeout(()=>{if(conns.has(h))h(open)},0);return()=>conns.delete(h)},
      leave:async()=>{r.left=true;rooms.delete(name);if(open)try{ws.send(JSON.stringify({t:'leave',room:name}))}catch(e){}}};
    if(open)ws.send(JSON.stringify({t:'join',room:name}));
    return r.api;
  }
  connect();const lobby=mk('lobby');
  lobby.join=async(name)=>{const r=rooms.get(name);return r?r.api:mk(name)};
  setInterval(()=>{if(open)try{ws.send('{"t":"ping"}')}catch(e){}},25000);
  return lobby;
}

      for(const p of guests){if(DU.lobby.some(x=>x.peer===p.peer))continue;if(DU.lobby.length>=3)continue;DU.lobby.push({peer:p.peer,name:safeName(p.presence.duel.name)||'Jogador'});changed=true}

function validCfg(c,players){
  const n=players.length;if(n<2||n>4)return false;

  if(!(c&&Number.isInteger(c.reg)&&c.reg>=0&&c.reg<REGIONS.length&&Number.isInteger(c.seed)&&Array.isArray(c.sites)&&c.sites.length>n&&c.sites.length<=40))return false;
  if(!c.sites.every(a=>Array.isArray(a)&&a.length===5&&a.every(v=>typeof v==='number'&&isFinite(v))))return false;
  for(let o=1;o<=n;o++)if(c.sites.filter(a=>a[2]===o).length!==1)return false;
  return c.sites.every(a=>a[2]>=0&&a[2]<=n);
}

  if(g.mode!=='local'&&g.tapSel&&s&&s!==g.tapSel){if(g.tapSel.owner===g.me)cmdSend(g.me,[g.tapSel],s);g.tapSel=null;return}
  g.tapSel=null;
  if(s&&g.mine.includes(s.owner))PTR.set(e.pointerId,{owner:s.owner,sel:[s],ptr:m,moved:false,down:s});
});
cv.addEventListener('pointermove',e=>{
  const g=game,d=PTR.get(e.pointerId);if(!g||!d)return;
  const m=toMap(e);d.ptr=m;
  if(Math.hypot(m.x-d.down.x,m.y-d.down.y)>18)d.moved=true;
  const s=hit(m);if(s&&s.owner===d.owner&&!d.sel.includes(s))d.sel.push(s);
});
cv.addEventListener('pointerup',e=>{
  const g=game,d=PTR.get(e.pointerId);PTR.delete(e.pointerId);if(!g||!d||!playable(g))return;
  const s=hit(toMap(e),d.moved?40:26);
  if(!d.moved&&s===d.down){if(g.mode!=='local')g.tapSel=s;return}
  if(s){const srcs=d.sel.filter(x=>x!==s&&x.owner===d.owner);if(srcs.length)cmdSend(d.owner,srcs,s)}
});
cv.addEventListener('pointercancel',e=>PTR.delete(e.pointerId));

/* render */
let lastR=0;
function pin(c,x,y,n,col,k){
  const T=TEAMC[col];c.save();c.translate(x,y);c.scale(k,k);
  c.beginPath();c.moveTo(0,9);c.bezierCurveTo(-3,5,-9.5,1.5,-9.5,-5);c.arc(0,-5,9.5,Math.PI,0);c.bezierCurveTo(9.5,1.5,3,5,0,9);c.closePath();
  c.fillStyle=T.badge;c.fill();c.lineWidth=2;c.strokeStyle='#fff';c.stroke();
  c.font='10.5px "Lilita One", sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';c.fillText(n,0,-4.6);
  c.restore();
}
function badge(c,x,y,n,col,prog,k,max){
  const T=TEAMC[col],r=10*k;
  c.beginPath();c.arc(x,y,r+3.6*k,0,7);c.fillStyle='#fff';c.fill();c.lineWidth=1.2*k;c.strokeStyle='#1e2536';c.stroke();
  c.beginPath();c.arc(x,y,r+1*k,0,7);c.fillStyle=T.badge;c.fill();
  c.beginPath();c.arc(x,y,r+2.2*k,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.max(0,Math.min(1,prog)));c.lineWidth=2.2*k;c.strokeStyle=col?T.hi:'#d3d8e3';c.stroke();
  c.font=`${(n>=100?10:12.5)*k}px "Lilita One", sans-serif`;c.textAlign='center';c.textBaseline='middle';
  c.lineWidth=2.4*k;c.strokeStyle='#1e2536';c.strokeText(n,x,y+0.6*k);c.fillStyle='#fff';c.fillText(n,x,y+0.6*k);
  if(max){c.font=`${8*k}px "Lilita One", sans-serif`;c.lineWidth=2*k;c.strokeText('MÁX',x,y+r+6*k);c.fillText('MÁX',x,y+r+6*k)}
}
const ang=(dx,dy)=>Math.atan2(dy,dx);
function turnTo(h,t,k){if(h==null)return t;let d=t-h;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return h+d*Math.min(1,k)}
function render(){
  const g=game,c=ctx,P=g.pal,now=performance.now(),rdt=Math.min(0.1,lastR?(now-lastR)/1000:0);lastR=now;
  const motion=g.mode==='world'?g.worldMotion.sample(g.units,now):null,units=motion?motion.units:g.units;
  c.setTransform(DPR,0,0,DPR,0,0);
  if(!g.bg||g.bgH!==CH){g.bg=c.createLinearGradient(0,0,0,CH);g.bg.addColorStop(0,'#8fdcf7');g.bg.addColorStop(.55,'#4f9fe0');g.bg.addColorStop(1,'#2f6fc0');g.bgH=CH}
  c.fillStyle=g.bg;c.fillRect(0,0,CW,CH);
  if(g.dirty){
    const im=g.img;if(im.width!==cv.width||im.height!==cv.height){im.width=cv.width;im.height=cv.height}
    const m=im.getContext('2d');m.setTransform(1,0,0,1,0,0);m.clearRect(0,0,im.width,im.height);
    m.setTransform(DPR*SC,0,0,DPR*SC,DPR*VX,DPR*VY);drawMap(m,g.L,g.sites,P);g.dirty=false;
  }
  c.setTransform(1,0,0,1,0,0);c.drawImage(g.img,0,0);c.setTransform(DPR,0,0,DPR,0,0);
  const X=x=>VX+x*SC,Y=y=>VY+y*SC;
  // alcance dos bombardeiros
  for(const s of g.sites){if(s.kind!=='central'&&s.kind!=='canhao')continue;const main=s.kind==='central';
    c.beginPath();c.arc(X(s.x),Y(s.y),RANGE[s.kind]*SC,0,7);c.fillStyle=main?'rgba(255,255,255,.13)':'rgba(255,255,255,.07)';c.fill();
    c.lineWidth=main?1.8:1.2;c.strokeStyle=main?'rgba(255,255,255,.7)':'rgba(255,255,255,.4)';if(!main)c.setLineDash([5*SC,5*SC]);c.stroke();c.setLineDash([])}
  // rotas das tropas
  c.lineCap='round';c.lineJoin='round';
  for(const u of units){c.beginPath();c.moveTo(X(u.x),Y(u.y));for(let i=u.si+1;i<u.P.length;i++)c.lineTo(X(u.P[i][0]),Y(u.P[i][1]));
    c.strokeStyle=TEAMC[P[u.owner]].dark;c.globalAlpha=.7;c.lineWidth=2.4*SC;c.setLineDash([6*SC,6*SC]);c.stroke();c.setLineDash([]);c.globalAlpha=1}
  // seleção e arrasto
  const selected=new Set();if(g.tapSel)selected.add(g.tapSel);
  for(const d of PTR.values()){
    d.sel.forEach(s=>selected.add(s));
    if(!d.moved)continue;
    c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=Math.max(3,5*SC);c.setLineDash([2,9*SC]);
    for(const s of d.sel){c.beginPath();c.moveTo(X(s.x),Y(s.y));c.lineTo(X(d.ptr.x),Y(d.ptr.y));c.stroke()}
    c.setLineDash([]);
    const t=hit(d.ptr);
    if(t){const ok=d.sel.some(s=>s!==t&&canReach(s,t));c.strokeStyle=!ok?'#e8433a':t.owner===d.owner?'#6cc24a':'#ffd34d';c.lineWidth=3.2;c.setLineDash(t.owner===d.owner?[]:[7,4]);hexPath(c,X(t.x),Y(t.y),HR*1.12*SC);c.stroke();c.setLineDash([])}
    c.beginPath();c.arc(X(d.ptr.x),Y(d.ptr.y),20*SC,0,7);c.fillStyle='rgba(255,255,255,.28)';c.fill();c.lineWidth=2;c.strokeStyle='#fff';c.stroke();
  }
  const pulse=0.5+0.5*Math.sin(g.vt*8);
  for(const s of selected){c.strokeStyle='#fff';c.lineWidth=3.2;hexPath(c,X(s.x),Y(s.y),HR*(1.1+pulse*0.04)*SC);c.stroke()}
  if(g.dropMode)for(const s of g.sites)if(s.owner===g.me){c.strokeStyle='#f2b632';c.lineWidth=3;hexPath(c,X(s.x),Y(s.y),HR*(1.1+pulse*0.08)*SC);c.stroke()}
  // torres miram o último alvo
  const C=g.sites[HX.center];
  for(const s of g.sites){if(s.kind!=='canhao')continue;const tx=s.tx!=null?s.tx:C.x,ty=s.ty!=null?s.ty:C.y;s.vh=turnTo(s.vh,ang(tx-s.x,ty-s.y),rdt*12);if(s.kick!=null)s.kick+=rdt}
  // prédios e marcadores (de trás para frente)
  const bs=g.sites.slice().sort((a,b)=>a.y-b.y);
  for(const s of bs)drawBase(c,s,P[s.owner]||0,X,Y,SC);
  for(const s of bs){const col=P[s.owner]||0,cap=s.owner?g.par[s.owner].cap:0,tr=Math.floor(s.troops);
    badge(c,X(s.x+18),Y(s.y+13),tr,col,s.owner?tr/cap:0.35,SC,s.owner&&s.troops>=cap-0.01)}
  // tropas
  const us=units.slice().sort((a,b)=>a.y-b.y);
  for(const u of us){
    const p=u.P,j=Math.min(p.length-1,u.si+1),tx=p[j][0]-u.x,ty=p[j][1]-u.y;
    if(u.fight){const o=u.fight.a===u?u.fight.b:u.fight.a;u.vh=turnTo(u.vh,ang(o.x-u.x,o.y-u.y),rdt*10)}
    else if(tx*tx+ty*ty>0.5)u.vh=turnTo(u.vh,ang(tx,ty),rdt*9);
    if(u.kick!=null)u.kick+=rdt;
    const kb=u.kick!=null&&u.kick<0.15?(1-u.kick/0.15)*3*SC:0,vh=u.vh||0;const x=X(u.x)-Math.cos(vh)*kb,y=Y(u.y)-Math.sin(vh)*kb*0.6,k=1.4*SC,col=P[u.owner];
    const bob=u.k==='heli'?Math.sin(g.vt*5+u.id)*1.5*k:u.k==='desliz'?Math.sin(g.vt*6+u.id)*0.6*k:0;
    c.beginPath();c.ellipse(x,y+1*k,(u.k==='heli'?12:16)*k,(u.k==='heli'?7.2:9.6)*k,0,0,7);c.fillStyle='rgba(11,26,58,.24)';c.fill();
    SPR.draw(c,SPR.unit(u.k,col,u.vh||0),x,y-bob,k);
    if(u.k==='heli'){const z=(17.8+12)*k,yy=y-bob-z;c.beginPath();c.ellipse(x,yy,19*k,19*0.6*k,0,0,7);c.fillStyle='rgba(255,255,255,.22)';c.fill();
      const a=g.vt*24+u.id;for(const b of [0,Math.PI/2]){const ca=Math.cos(a+b)*19*k,sa=Math.sin(a+b)*19*0.6*k;c.beginPath();c.moveTo(x+ca,yy+sa);c.lineTo(x-ca,yy-sa);c.lineWidth=2.6*SC;c.strokeStyle='rgba(30,37,54,.8)';c.stroke();c.lineWidth=1.2*SC;c.strokeStyle='#7a839a';c.stroke()}}
    pin(c,x,y-bob-(u.k==='heli'?62:40)*SC,u.n,col,SC);
  }
  // efeitos
  c.textAlign='center';c.textBaseline='middle';
  for(const f of g.fx){
    if(f.type==='shot'){
      if(!f.m){const h=ang(f.x-f.s.x,f.y-f.s.y);f.m=SPR.muzzle(f.s,f.s.kind==='canhao'?(f.s.vh!=null?f.s.vh:h):h);f.ty=f.y-(f.heli?26:8)}
      const q=Math.min(1,f.t/0.3),mx=f.m[0]+(f.x-f.m[0])*q,my=f.m[1]+(f.ty-f.m[1])*q;
      if(f.t<0.14){c.beginPath();c.arc(X(f.m[0]),Y(f.m[1]),(6*(1-f.t/0.14)+2)*SC,0,7);c.fillStyle='rgba(255,211,77,'+(1-f.t/0.14)+')';c.fill()}
      if(f.t<0.32){const q0=Math.max(0,q-0.35);c.beginPath();c.moveTo(X(f.m[0]+(f.x-f.m[0])*q0),Y(f.m[1]+(f.ty-f.m[1])*q0));c.lineTo(X(mx),Y(my));c.strokeStyle='rgba(255,224,102,.85)';c.lineWidth=2.6*SC;c.stroke();
        c.beginPath();c.arc(X(mx),Y(my),4.2*SC,0,7);c.fillStyle='#2b3347';c.fill();c.lineWidth=1.4;c.strokeStyle='#fff';c.stroke()}
      if(f.t>=0.3&&f.t<0.7){const e=(f.t-0.3)/0.4;c.beginPath();c.arc(X(f.x),Y(f.ty),(6+12*e)*SC,0,7);c.fillStyle='rgba(255,211,77,'+0.8*(1-e)+')';c.fill()}
      if(f.t>0.3){const e=(f.t-0.3)/0.7;c.globalAlpha=Math.max(0,1-e);c.font=`${17*SC}px "Lilita One", sans-serif`;c.lineWidth=4;c.strokeStyle='#fff';c.strokeText('-1',X(f.x),Y(f.ty-34-18*e));c.fillStyle='#e8433a';c.fillText('-1',X(f.x),Y(f.ty-34-18*e));c.globalAlpha=1}
    }
    else if(f.type==='ring'){c.strokeStyle=f.c;c.globalAlpha=Math.max(0,1-f.t/0.8);c.lineWidth=4;c.beginPath();c.arc(X(f.x),Y(f.y),(HR*0.8+f.t*70)*SC,0,7);c.stroke();c.globalAlpha=1}
    else if(f.type==='cap'){const e=f.t/1.2;c.globalAlpha=Math.max(0,1-e*e);c.font=`${15*SC}px "Lilita One", sans-serif`;c.lineWidth=4;c.strokeStyle='#fff';c.strokeText('CAPTURADO!',X(f.x),Y(f.y-44-14*e));c.fillStyle=TEAMC[P[f.o]].dark;c.fillText('CAPTURADO!',X(f.x),Y(f.y-44-14*e));c.globalAlpha=1}
    else if(f.type==='hit'){c.globalAlpha=Math.max(0,1-f.t/0.6);c.strokeStyle='#e8433a';c.lineWidth=4*(1-f.t/0.6)+0.5;hexPath(c,X(f.x),Y(f.y),HR*(1+0.3*f.t)*SC);c.stroke();c.globalAlpha=1}
    else if(f.type==='ushot'){
      const a=motion?motion.byId.get(f.from.id):f.from,b=motion?motion.byId.get(f.to.id):f.to;
      if(!a||!b)continue;
      const vh=a.vh!=null?a.vh:ang(b.x-a.x,b.y-a.y),kk=1.4*SC;
      const up=a.k==='heli'?(9.5+12)*kk:a.k==='desliz'?9*kk:12*kk,fw=a.k==='tanque'?20:a.k==='heli'?11:9;
      const mx=X(a.x)+Math.cos(vh)*fw*kk,my=Y(a.y)+Math.sin(vh)*fw*kk*0.6-up;
      const ex=X(b.x),ey=Y(b.y)-(b.k==='heli'?26:8)*SC,q=Math.min(1,f.t/0.15);
      if(f.t<0.1){c.beginPath();c.arc(mx,my,(5*(1-f.t/0.1)+2)*SC,0,7);c.fillStyle='rgba(255,224,102,'+(1-f.t/0.1)+')';c.fill()}
      if(f.t<0.17){const q0=Math.max(0,q-0.5);c.beginPath();c.moveTo(mx+(ex-mx)*q0,my+(ey-my)*q0);c.lineTo(mx+(ex-mx)*q,my+(ey-my)*q);c.strokeStyle='rgba(255,224,102,.9)';c.lineWidth=2.2*SC;c.stroke();
        c.beginPath();c.arc(mx+(ex-mx)*q,my+(ey-my)*q,2.6*SC,0,7);c.fillStyle='#2b3347';c.fill()}
      if(f.t>=0.15&&f.t<0.45){const e=(f.t-0.15)/0.3;c.beginPath();c.arc(ex,ey,(4+9*e)*SC,0,7);c.fillStyle='rgba(255,155,61,'+0.85*(1-e)+')';c.fill()}
      if(f.t>0.15){const e=(f.t-0.15)/0.65;c.globalAlpha=Math.max(0,1-e);c.font=`${14*SC}px "Lilita One", sans-serif`;c.lineWidth=3.5;c.strokeStyle='#fff';c.strokeText('-1',ex+18*SC,ey-14*SC-14*e*SC);c.fillStyle='#e8433a';c.fillText('-1',ex+18*SC,ey-14*SC-14*e*SC);c.globalAlpha=1}
    }
    else if(f.type==='clash'){const e=f.t/0.5;c.globalAlpha=Math.max(0,1-e);c.beginPath();c.arc(X(f.x),Y(f.y-14),(10+30*e)*SC,0,7);c.strokeStyle='#fff';c.lineWidth=4*(1-e)+1;c.stroke();c.globalAlpha=1}
    else if(f.type==='boom'){const e=f.t/0.6;c.globalAlpha=Math.max(0,1-e);c.beginPath();c.arc(X(f.x),Y(f.y),(8+24*e)*SC,0,7);c.fillStyle='#fff';c.fill();c.beginPath();c.arc(X(f.x),Y(f.y),(5+14*e)*SC,0,7);c.fillStyle='#ff9b3d';c.fill();c.globalAlpha=1}
    else if(f.type==='txt'){c.globalAlpha=Math.max(0,1-f.t/1.2);c.font='20px "Lilita One", sans-serif';c.lineWidth=4;c.strokeStyle='#fff';c.strokeText(f.text,X(f.x),Y(f.y)-f.t*30);c.fillStyle='#e0a412';c.fillText(f.text,X(f.x),Y(f.y)-f.t*30);c.globalAlpha=1}
  }
  const big=(txt,size,yy)=>{c.font=`${size}px "Lilita One", sans-serif`;c.lineWidth=8;c.strokeStyle='#fff';c.strokeText(txt,CW/2,yy);c.fillStyle='#24346b';c.fillText(txt,CW/2,yy)};
  if(g.cd>0&&!g.over)big(String(Math.ceil(g.cd)),90,CH/2);
  if(g.waiting>0.6&&!g.over)big(g.mode==='world'?'Reconectando…':'Aguardando oponente…',22,TOPM+30);
}
let lastBar='';
function hud(){
  const g=game,cnt=[0,0,0,0,0];for(const s of g.sites)cnt[s.owner]++;
  const n=g.sites.length,order=g.mode==='solo'?[1,2,3,4,0]:[g.me].concat(Array.from({length:g.n},(_,i)=>i+1).filter(o=>o!==g.me),[0]);
  const key=cnt.join(',')+g.me;
  if(key!==lastBar){lastBar=key;$('#pbar').innerHTML=order.filter(o=>cnt[o]).map(o=>`<div style="width:${cnt[o]/n*100}%;background:${COL[g.pal[o]].fill}"></div>`).join('')}
  if(g.mode!=='solo'||g.cpu){const el=Math.max(0,g.time),mm=Math.floor(el/60),ss=Math.floor(el%60);$('#lvTag').innerHTML='DUELO<br>'+mm+':'+String(ss).padStart(2,'0')}
  if(g.mode==='world')$('#lvTag').innerHTML='ÁREA '+g.worldOrdinal+'<br>'+Math.floor(g.time/60)+':'+String(Math.floor(g.time%60)).padStart(2,'0');
  if(g.mode==='online'){const k='L'+g.elim.join(',')+(g.gone?Object.keys(g.gone).join(','):'');if(k!==g.legKey){g.legKey=k;$('#legend').innerHTML=Array.from({length:g.n},(_,i)=>i+1).map(o=>`<span class="${g.elim.includes(o)?'out':''}"><i style="background:${COL[g.pal[o]].base}"></i>${o===g.me?'Você':esc(g.names[o])}</span>`).join('')}}
  const b=$('#btnDrop'),dm=g.dropM[g.me]||0;b.style.setProperty('--p',Math.round(dm*100));
  b.classList.toggle('ready',dm>=1&&!g.dropMode);b.classList.toggle('active',g.dropMode);
}

// Only the server advances world battles. This bridge reuses the existing renderer.
window.DOMINATION_WORLD_BRIDGE={
  start(record,onCommand){
    closeModal();
    const L=buildLevel(1,MW,MAPH,{nAI:1});
    newGame({mode:'world',L,sites:L.sites.map(s=>({...s})),par:record.snapshot.par,n:2,elim:[],worldCommand:onCommand,
      worldMotion:window.createWorldMotion(),worldOrdinal:record.ordinal||1,lastServerAt:performance.now(),names:{1:'Você',2:record.defenderName},cd:record.snapshot.cd});
    document.body.classList.add('world-battle');
    $('#legend').innerHTML='<span><i style="background:#2457c0"></i>Você</span><span><i style="background:#c22d27"></i>Defesa CPU</span>';
    $('#hint').textContent='Elimine o inimigo · o bombardeiro é uma vantagem';$('#hint').style.opacity=1;
    this.apply(record.snapshot);
  },
  apply(snapshot){
    const g=game;if(!g||g.mode!=='world')return;
    g.lastServerAt=performance.now();g.time=snapshot.time;g.cd=snapshot.cd;g.par=snapshot.par;g.dropM=snapshot.dropM;g.over=snapshot.over;
    g.worldMotion.receive(snapshot.units,snapshot.time,g.lastServerAt,snapshot.over);
    for(const data of snapshot.sites){const site=g.sites[data.id];if(site.owner!==data.owner)g.dirty=true;Object.assign(site,data);}
    const previous=new Map(g.units.map(u=>[u.id,u]));
    g.units=snapshot.units.map(data=>Object.assign(previous.get(data.id)||{},data,{fight:null}));
    const units=new Map(g.units.map(u=>[u.id,u]));
    for(const u of g.units)if(u.fighting!=null&&units.has(u.fighting))u.fight={a:u,b:units.get(u.fighting)};
    g.fx=snapshot.fx.map(f=>({...f,s:f.site!=null?g.sites[f.site]:null,from:units.get(f.from),to:units.get(f.to)})).filter(f=>f.type!=='ushot'||(f.from&&f.to));
    if(g.time>8)$('#hint').style.opacity=0;
  },
  stop(){if(game&&game.mode==='world'){game=null;PTR.clear();$('#game').classList.remove('on');$('#legend').innerHTML='';}document.body.classList.remove('world-battle');},
  classic(){this.stop();document.body.classList.remove('world-mode');setTab('battle');},
  show(){if(game&&game.mode!=='world')exitGame();document.body.classList.add('world-mode');}
};

window.DOMDBG=()=>({game,VX,VY,SC,HX,send});
let last=performance.now();
function loop(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  if(game){frame(dt);if(game){render();hud()}}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

refreshAll();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(tab==='battle')drawPreview()});
setTimeout(()=>{if(tab==='battle')drawPreview()},50);
})();
